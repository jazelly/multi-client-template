services:
  postgres:
    image: postgres:17-alpine
    container_name: multi-client-template-postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - 127.0.0.1:5434:5432
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U app
      interval: 2s
      retries: 20

volumes:
  postgres:
